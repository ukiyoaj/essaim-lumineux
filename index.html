<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Essaim lumineux</title>
  <meta name="description" content="Un essaim de milliers d'aiguilles lumineuses qui suit le curseur, avec horloge et couleurs personnalisables.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@200;300;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <canvas id="ciel" aria-hidden="true"></canvas>
  <canvas id="essaim" aria-label="Essaim de particules qui suit le curseur"></canvas>

  <p class="aide" id="aide">Bouge la souris · clique pour disperser · double-clic pour le plein écran</p>

  <div class="horloge" id="horloge">
    <div class="heure" id="heure">--:--</div>
    <div class="date" id="date"></div>
  </div>

  <button class="ouvrir" id="ouvrir" aria-expanded="false" aria-controls="panneau" title="Personnaliser">
    <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M12 3a9 9 0 0 0 0 18c1 0 1.6-.8 1.6-1.6 0-.4-.2-.8-.4-1.1-.3-.3-.4-.7-.4-1.1 0-.9.7-1.6 1.6-1.6h1.9A4.7 4.7 0 0 0 21 11c0-4.4-4-8-9-8Z" fill="none" stroke="currentColor" stroke-width="1.6"/><circle cx="7.5" cy="11" r="1.3" fill="currentColor"/><circle cx="10.5" cy="7.3" r="1.3" fill="currentColor"/><circle cx="15" cy="7.6" r="1.3" fill="currentColor"/></svg>
    <span>Couleurs</span>
  </button>

  <aside class="panneau" id="panneau" hidden>
    <div class="panneau-tete">
      <h2>Personnaliser</h2>
      <button class="fermer" id="fermer" aria-label="Fermer">×</button>
    </div>

    <p class="label">Ambiances</p>
    <div class="presets" id="presets"></div>

    <p class="label">Tes couleurs</p>
    <div class="perso" id="perso"></div>

    <label class="label" for="nombre">Nombre d'aiguilles <output id="nombre-val"></output></label>
    <input type="range" id="nombre" min="1000" max="12000" step="500">

    <label class="label" for="taille">Taille du disque <output id="taille-val"></output></label>
    <input type="range" id="taille" min="50" max="160" step="5">

    <label class="case"><input type="checkbox" id="voir-horloge"> Afficher l'heure et la date</label>

    <button class="reset" id="reset">Réinitialiser</button>
  </aside>

  <p class="erreur" id="erreur" hidden>Ton navigateur ne supporte pas WebGL : l'essaim ne peut pas s'afficher.</p>

  <script src="js/essaim.js"></script>
</body>
</html>
